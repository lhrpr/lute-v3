<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lute</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1b;
        --muted: #6b7280;
        --accent: #1565c0;
        --err: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1e24;
          --fg: #e6e6e6;
          --muted: #9aa4b2;
          --accent: #64b5f6;
          --err: #f2b8b5;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .box {
        text-align: center;
        max-width: 460px;
        padding: 24px;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin: 0 0 6px;
      }
      .status {
        color: var(--muted);
        font-size: 14px;
        margin-top: 18px;
        min-height: 1.2em;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 22px auto 0;
        border: 3px solid color-mix(in srgb, var(--muted) 35%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        display: none;
        color: var(--err);
        font-size: 14px;
        line-height: 1.5;
        margin-top: 18px;
        white-space: pre-wrap;
        text-align: left;
        -webkit-user-select: text;
        user-select: text;
      }
      body.has-error .spinner {
        display: none;
      }
      body.has-error .error {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="title">Lute</p>
      <div class="spinner" aria-hidden="true"></div>
      <p class="status" id="status">Starting the Lute server&hellip;</p>
      <pre class="error" id="error"></pre>
    </div>
    <script>
      // Called from the Rust side if the server fails to start.
      window.__luteError = function (msg) {
        document.body.classList.add("has-error");
        document.getElementById("status").textContent = "Could not start Lute.";
        document.getElementById("error").textContent = String(msg || "");
      };
    </script>
  </body>
</html>
